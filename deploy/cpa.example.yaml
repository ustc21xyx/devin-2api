# Merge this provider into the existing list; do not replace the CPA config.
openai-compatibility:
  - name: devin
    base-url: "http://127.0.0.1:18460/v1"
    api-key-entries:
      - api-key: "SAME_AS_DEVIN_2API_AUTH_API_KEY"
        proxy-url: "direct"
    models:
      - name: "swe-2"
        alias: "devin/swe-2"
        display-name: "SWE-2 (Devin)"
        max-context-length: 262000
        input-modalities: [text, image]
        output-modalities: [text]
        # The adapter chooses the upstream variant using reasoning_effort.
        thinking:
          levels: [medium, high, max]
